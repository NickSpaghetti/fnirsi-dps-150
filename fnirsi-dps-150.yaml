package:
  name: fnirsi-dps-150
  version: 1.0.0
  epoch: 0
  description: "A secure Bun-based static server for Wolfi"

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - wolfi-base
      - busybox
      - bun
      - build-base

pipeline:
  - name: Build and Package
    runs: |
      # 1. Prepare directories
      APP_DIR="${{targets.destdir}}/usr/lib/my-app"
      BIN_DIR="${{targets.destdir}}/usr/bin"
      mkdir -p "$APP_DIR" "$BIN_DIR"

      # 2. Install production dependencies
      # Note: This requires package.json and bun.lockb to exist in the root
      bun install --frozen-lockfile --production

      # 3. Copy application files
      cp -r . "$APP_DIR/"

      # 4. Create the entrypoint script
      cat <<EOF > "$BIN_DIR/my-app"
      #!/bin/sh
      cd /usr/lib/my-app
      exec bun x serve .
      EOF
      
      chmod +x "$BIN_DIR/my-app"

  - uses: strip
